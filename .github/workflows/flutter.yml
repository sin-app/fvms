name: Flutter

on:
  push:
    branches: [main]
    paths: ["fvms_flutter/**", ".github/workflows/flutter.yml"]
  pull_request:
    branches: [main]
    paths: ["fvms_flutter/**"]
  workflow_dispatch:

jobs:
  analyze_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fvms_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --coverage

  build_android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    needs: analyze_test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: fvms_flutter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Decode keystore
        if: env.TWA_KEYSTORE_B64 != ''
        env:
          TWA_KEYSTORE_B64: ${{ secrets.TWA_KEYSTORE_B64 }}
        run: |
          echo "$TWA_KEYSTORE_B64" | base64 -d > android/app/fvms.keystore || true
      - name: Build APK (split)
        run: flutter build apk --release --split-per-abi --dart-define=SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Build AAB
        run: flutter build appbundle --release --dart-define=SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: fvms-flutter-apk
          path: fvms_flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: fvms-flutter-aab
          path: fvms_flutter/build/app/outputs/bundle/release/*.aab
          retention-days: 7
          overwrite: true
