name: Health Monitor

on:
  schedule:
    - cron: "*/30 * * * *" # tiap 30 menit
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Vercel Production
        run: |
          set -e
          URL="https://fvms-eight.vercel.app/health"
          echo "Probe $URL"
          CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" "$URL" || echo "000")
          cat /tmp/out.txt
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then echo "::error::Health $CODE"; exit 1; fi
          grep -q '"status":"ok"' /tmp/out.txt || (echo "::error::Health body != ok"; exit 1)
          echo "✅ Health OK"

      - name: Probe Vercel Deployment (API)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ]; then echo "skip Vercel API (no token)"; exit 0; fi
          RES=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?limit=1&target=production")
          STATE=$(echo "$RES" | python3 -c "import sys,json; print(json.load(sys.stdin)['deployments'][0]['state'])")
          echo "Vercel state: $STATE"
          if [ "$STATE" != "READY" ]; then echo "::error::Vercel $STATE"; exit 1; fi

      - name: Create Issue on Failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 Health Monitor Gagal $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="Probe https://fvms-eight.vercel.app/health gagal. Cek Vercel & /health. Auto-generated by health-monitor.yml"
          curl -sf -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "$(python3 -c "import json; print(json.dumps({'title':'$TITLE','body':'$BODY','labels':['health','bug']}))")"
