name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: TypeCheck & Lint & Test
    runs-on: ubuntu-latest
    # Vitest berjalan terisolasi per file (vi.mock per file butuh registry
    # sendiri) — import graph berat ~5 menit; ditambah build/lint/typecheck.
    # 40 menit memberi margin aman agar tidak fail oleh durasi.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    # E2E butuh instance Supabase terisolasi; non-aktif secara default agar
    # CI tidak merah tanpa DB tes. Aktifkan dengan repo var RUN_E2E=true
    # (sertakan secret NEXT_PUBLIC_SUPABASE_URL/anon/service-role untuk DB tes).
    if: ${{ vars.RUN_E2E == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Build & Start Dev Server
        run: |
          npm run build
          npm run start &
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "server ready"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://localhost:3000 >/dev/null 2>&1; then
            echo "server failed to start within 120s"
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run Playwright Tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
