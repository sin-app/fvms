name: Android TWA Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-*"

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android platform
        run: |
          sdkmanager "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" || true
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Prepare keystore
        id: keystore
        run: |
          mkdir -p android/build
          if [ -n "${{ secrets.TWA_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.TWA_KEYSTORE_B64 }}" | base64 -d > android/build/upload.keystore
            echo "keystore: from secret"
          else
            PASSWORD="fvms-upload-2026"
            keytool -genkeypair -v -keystore android/build/upload.keystore \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -dname "CN=FVMS, OU=TWA, O=Sin App, L=Jakarta, C=ID"
            echo "keystore: generated (backup dari artifact!)"
          fi

      - name: Build TWA release (AAB + APK)
        env:
          TWA_KEYSTORE_PATH: ${{ github.workspace }}/android/build/upload.keystore
          TWA_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          TWA_KEY_ALIAS: ${{ secrets.TWA_KEY_ALIAS }}
        run: |
          cd android
          ./gradlew --no-daemon --console=plain :app:assembleRelease :app:bundleRelease

      - name: Save keystore artifact (backup permanen)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: android/build/upload.keystore
          if-no-files-found: ignore

      - name: Compute fingerprint & write assetlinks.json (TWA trust)
        id: fp
        env:
          TWA_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
        run: |
          FP=$(keytool -list -v -keystore android/build/upload.keystore \
            -alias upload -storepass "${TWA_KEYSTORE_PASSWORD:-fvms-upload-2026}" 2>/dev/null | \
            grep -oE "[0-9A-F]{2}(:[0-9A-F]{2}){31}" | tail -1)
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          mkdir -p public/.well-known
          echo '[{' > public/.well-known/assetlinks.json
          echo '  "relation": ["delegate_permission/common.handle_all_urls"],' >> public/.well-known/assetlinks.json
          echo '  "target": { "namespace": "android_app", "package_name": "id.sinapp.fvms" },' >> public/.well-known/assetlinks.json
          echo "  \"sha256_cert_fingerprints\": [\"$FP\"]" >> public/.well-known/assetlinks.json
          echo '}]' >> public/.well-known/assetlinks.json
          echo "## Signing SHA-256 (TWA trust)" >> "$GITHUB_STEP_SUMMARY"
          echo "$FP" >> "$GITHUB_STEP_SUMMARY"
          echo "File public/.well-known/assetlinks.json dibuat & akan di-commit otomatis, lalu di-deploy Vercel." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit assetlinks.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(android): update TWA assetlinks.json fingerprint [skip ci]"
          file_pattern: "public/.well-known/assetlinks.json"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fvms-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: fvms-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error